
name: Build BIANXYTER AI

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android SDK Manager
        run: |
          echo "Searching SDK Manager..."
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          echo "Found: $SDKMANAGER"

      - name: Install SDK 34
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-34"
          "$SDKMANAGER" --install "build-tools;34.0.0"
          "$SDKMANAGER" --install "platform-tools"

      - name: Extract project
        run: unzip -o BIANXYTER-AI-GitHub-Build.zip -d project

      - name: Build APK
        run: gradle -p project --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIANXYTER-AI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
